<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF6FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18212E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="통통 국무사">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<title>통통 국무사</title>
<style>
:root {
  --bg: #EEF6FF;
  --card: #FFFFFF;
  --soft: #E3EFFC;
  --line: #D6E5F5;
  --ink: #2F3A4A;
  --ink2: #6A7889;
  --ink3: #A3B0BF;
  --sea: #4C9DF2;
  --sea-d: #3480D3;
  --sea-s: #DCEBFD;
  --coral: #FF7B7B;
  --coral-d: #E85F65;
  --coral-s: #FFE3E1;
  --mint: #4FC59A;
  --mint-d: #36A57D;
  --mint-s: #D9F4E8;
  --butter: #FFC84A;
  --butter-d: #D9A22B;
  --butter-s: #FFF2CC;
  --lilac: #A98BEA;
  --lilac-s: #EEE6FD;
  --shadow: 0 4px 0 rgba(47, 58, 74, .07), 0 10px 24px rgba(76, 157, 242, .12);
  --r: 22px;
  --fk: 'Jua', 'Nunito', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --fp: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --fb: 'Nunito', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18212E; --card: #222D3C; --soft: #2C394A; --line: #334256;
    --ink: #EAF1F9; --ink2: #AEBBCB; --ink3: #7C8A9B;
    --sea-s: #22395A; --coral-s: #4A2E35; --mint-s: #1F4237; --butter-s: #4A3F22; --lilac-s: #3A3157;
    --shadow: 0 4px 0 rgba(0, 0, 0, .25), 0 10px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18212E; --card: #222D3C; --soft: #2C394A; --line: #334256;
  --ink: #EAF1F9; --ink2: #AEBBCB; --ink3: #7C8A9B;
  --sea-s: #22395A; --coral-s: #4A2E35; --mint-s: #1F4237; --butter-s: #4A3F22; --lilac-s: #3A3157;
  --shadow: 0 4px 0 rgba(0, 0, 0, .25), 0 10px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
.app { max-width: 720px; margin: 0 auto; min-height: 100%; padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 100px) max(16px, env(safe-area-inset-left)); }
h1, h2, h3 { font-family: var(--fk); font-weight: 400; margin: 0; letter-spacing: -.01em; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
b, strong { font-weight: 800; }

/* top */
.top { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
.top h1 { font-size: 27px; }
.top .grow { flex: 1; min-width: 0; }
.top .sub { color: var(--ink2); font-size: 14px; }
.hello { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.hello svg { flex: none; }
.bubble { background: var(--card); border-radius: 18px 18px 18px 6px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 15px; }
.bubble b { color: var(--sea-d); }

/* cards */
.card { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card h2 { font-size: 20px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--fk); font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.tag.sea { background: var(--sea-s); color: var(--sea-d); }
.tag.coral { background: var(--coral-s); color: var(--coral-d); }
.tag.mint { background: var(--mint-s); color: var(--mint-d); }
.tag.butter { background: var(--butter-s); color: #A87A0E; }
.tag.lilac { background: var(--lilac-s); color: #7A5BC9; }
:root[data-theme="dark"] .tag:not(.coral) { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag:not(.coral) { color: var(--ink); } }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 14px; }
.stat { border-radius: 16px; padding: 10px 6px 8px; text-align: center; }
.stat b { display: block; font-family: var(--fp); font-weight: 900; font-size: 26px; line-height: 1.1; }
.stat span { font-family: var(--fk); font-size: 13px; color: var(--ink2); }
.stat.sea { background: var(--sea-s); } .stat.sea b { color: var(--sea-d); }
.stat.mint { background: var(--mint-s); } .stat.mint b { color: var(--mint-d); }
.stat.coral { background: var(--coral-s); } .stat.coral b { color: var(--coral-d); }
.stat.butter { background: var(--butter-s); } .stat.butter b { color: #B98612; }

.dday { display: flex; align-items: center; gap: 14px; }
.dday .num { font-family: var(--fp); font-weight: 900; font-size: 40px; line-height: 1; color: var(--sea-d); }
.dday .t { flex: 1; }
.dday .t b { font-family: var(--fk); font-weight: 400; font-size: 18px; display: block; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 12px 18px;
  border-radius: 18px; font-family: var(--fk); font-size: 18px; background: var(--sea); color: #fff;
  box-shadow: 0 4px 0 var(--sea-d); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sea-d); }
.btn.mint { background: var(--mint); box-shadow: 0 4px 0 var(--mint-d); }
.btn.coral { background: var(--coral); box-shadow: 0 4px 0 var(--coral-d); }
.btn.ghost { background: var(--soft); color: var(--ink); box-shadow: 0 4px 0 var(--line); }
.btn[disabled] { background: var(--soft); color: var(--ink3); box-shadow: none; transform: none; cursor: default; }
.btn svg { width: 22px; height: 22px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stack { display: grid; gap: 10px; }

/* subject progress */
.subj { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1.5px solid var(--line); cursor: pointer; }
.subj:last-child { border-bottom: 0; }
.subj .n { font-family: var(--fk); font-size: 16px; display: flex; align-items: center; gap: 8px; }
.subj .r { font-family: var(--fp); font-weight: 800; font-size: 13px; color: var(--ink2); text-align: right; }
.bar { grid-column: 1 / -1; height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b1 { background: var(--sea); }
.bar .b2 { background: var(--mint); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); flex-wrap: wrap; margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.sdot { width: 12px; height: 12px; border-radius: 4px; flex: none; }

/* nav */
.nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 20;
  display: flex; gap: 4px; background: var(--card); padding: 6px; border-radius: 26px; box-shadow: 0 8px 30px rgba(47, 58, 74, .18);
  width: min(440px, calc(100% - 24px));
}
.nav .ni { flex: 1; color: var(--ink3); display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 4px 6px; border-radius: 20px; font-family: var(--fk); font-size: 12.5px; position: relative; }
.nav .ni svg { width: 24px; height: 24px; }
.nav .ni.on { background: var(--sea-s); color: var(--sea-d); }
.nav .badge { position: absolute; top: 3px; right: calc(50% - 22px); background: var(--coral); color: #fff; font-family: var(--fp); font-weight: 900; font-size: 10.5px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
button:focus-visible, .item:focus-visible, .subj:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }

/* lists */
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 18px; padding: 0 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.search svg { width: 20px; height: 20px; color: var(--ink3); flex: none; }
.search input { border: 0; outline: 0; background: none; height: 50px; width: 100%; font-size: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 10px; margin: 0 -16px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--card); box-shadow: 0 2px 0 var(--line); font-family: var(--fk); font-size: 14px; color: var(--ink2); white-space: nowrap; }
.chip.on { background: var(--sea); color: #fff; box-shadow: 0 2px 0 var(--sea-d); }
.chipwrap { display: flex; flex-wrap: wrap; gap: 8px; }
.unit { font-family: var(--fk); font-size: 14px; color: var(--ink2); margin: 16px 4px 8px; }
.list { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1.5px solid var(--line); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item .t { flex: 1; min-width: 0; }
.item .t b { display: block; font-family: var(--fk); font-weight: 400; font-size: 16.5px; line-height: 1.35; }
.item .t span { display: block; color: var(--ink2); font-size: 13.5px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--soft); box-shadow: inset 0 0 0 2px var(--line); }
.dot.seen { background: var(--sea); box-shadow: none; }
.star { color: var(--ink3); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; flex: none; }
.star svg { width: 22px; height: 22px; }
.star.on { color: #F2B320; }
.listhead { display: flex; align-items: center; justify-content: space-between; margin: 6px 4px 10px; gap: 10px; }
.empty { text-align: center; padding: 30px 10px; color: var(--ink2); }

/* concept card */
.sbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.iconbtn { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn.on { background: var(--butter-s); color: #E0A100; }
.sbar .mid { flex: 1; min-width: 0; text-align: center; font-family: var(--fk); color: var(--ink2); font-size: 14px; }
.concept { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 20px 18px 18px; }
.concept .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.concept h2 { font-size: clamp(22px, 6.4vw, 28px); line-height: 1.3; margin-bottom: 14px; }
.sec { border-radius: 18px; padding: 12px 14px; margin-top: 10px; font-size: 15.5px; line-height: 1.65; }
.sec .lab { font-family: var(--fk); font-size: 14px; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.sec.easy { background: var(--sea-s); } .sec.easy .lab { color: var(--sea-d); }
.sec.ex { background: var(--mint-s); } .sec.ex .lab { color: var(--mint-d); }
.sec.pt { background: var(--butter-s); } .sec.pt .lab { color: #A87A0E; }
:root[data-theme="dark"] .sec .lab { color: var(--ink) !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sec .lab { color: var(--ink) !important; } }
.src { margin-top: 12px; font-size: 12.5px; color: var(--ink3); text-align: right; }
.navbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

/* quiz */
.prog { flex: 1; height: 14px; background: var(--card); border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line); }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--sea), #7CC0FF); border-radius: 999px; transition: width .3s; }
.qbox { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 20px 18px; }
.qbox .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.qtext { font-size: 17.5px; line-height: 1.6; font-weight: 700; }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.oxb { border-radius: 22px; min-height: 92px; font-family: var(--fp); font-weight: 900; font-size: 44px; background: var(--soft); box-shadow: 0 4px 0 var(--line); transition: transform .08s; }
.oxb.o { color: var(--sea-d); } .oxb.x { color: var(--coral-d); }
.oxb:active { transform: translateY(3px); }
.choices { display: grid; gap: 10px; margin-top: 16px; }
.choice { background: var(--soft); border-radius: 18px; padding: 13px 14px; text-align: left; font-size: 16px; font-weight: 700; line-height: 1.45; box-shadow: 0 4px 0 var(--line); transition: transform .08s; display: flex; gap: 10px; }
.choice .no { font-family: var(--fp); font-weight: 900; color: var(--ink3); flex: none; }
.choice:active { transform: translateY(2px); }
.choice.ok, .oxb.ok { background: var(--mint); color: #fff; box-shadow: 0 4px 0 var(--mint-d); }
.choice.bad, .oxb.bad { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-d); }
.choice.ok .no, .choice.bad .no { color: #fff; }
.choice.dim, .oxb.dim { opacity: .45; }
.fb { margin-top: 14px; border-radius: 18px; padding: 12px 14px; font-size: 15px; line-height: 1.6; animation: pop .22s ease-out; }
.fb.good { background: var(--mint-s); } .fb.bad { background: var(--coral-s); }
.fb .head { font-family: var(--fk); font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.fb .head svg { flex: none; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.link { color: var(--sea-d); font-family: var(--fk); font-size: 14.5px; display: inline-flex; align-items: center; gap: 4px; padding: 6px 2px; }
.optrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid var(--line); }
.optrow:last-child { border-bottom: 0; }
.optrow .t { flex: 1; }
.optrow .t b { display: block; font-family: var(--fk); font-weight: 400; font-size: 16px; }
.optrow .t span { display: block; color: var(--ink2); font-size: 13px; }
.seg { display: flex; background: var(--soft); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { padding: 7px 12px; border-radius: 10px; font-family: var(--fk); font-size: 14.5px; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--sea-d); box-shadow: 0 2px 0 var(--line); }

/* done */
.done { text-align: center; padding: 18px 8px 8px; }
.done h2 { font-size: 26px; margin: 10px 0 4px; }
.done .score { font-family: var(--fp); font-weight: 900; font-size: 54px; color: var(--sea-d); line-height: 1.1; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(30, 40, 55, .38); z-index: 40; animation: fade .18s; }
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(720px, 100%); max-height: 88vh; overflow-y: auto; z-index: 41;
  background: var(--bg); border-radius: 28px 28px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 18px); animation: up .22s ease-out;
}
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }
@keyframes up { from { transform: translate(-50%, 40px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
textarea.io { width: 100%; min-height: 110px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); padding: 10px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 100px); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 16px; font-family: var(--fk); font-size: 15px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .2); max-width: calc(100% - 32px); text-align: center; animation: fade .2s;
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 700px) {
  .app { padding-top: calc(env(safe-area-inset-top) + 24px); }
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .home-grid .card { margin-bottom: 0; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<nav id="nav" class="nav"></nav>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
